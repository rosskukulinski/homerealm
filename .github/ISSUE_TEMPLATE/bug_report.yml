name: Bug report
description: Something in homerealm isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For a **security vulnerability**, don't file
        here — see [SECURITY.md](https://github.com/rosskukulinski/homerealm/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I clicked Start on a world and it stayed "stopped"…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The panel footer shows it (e.g. "homerealm v0.4.0"), or the image tag you deployed.
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: How are you reaching the panel?
      options:
        - Over the tailnet (https://<hostname>)
        - LAN listener (plain HTTP, :8090)
        - Both
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Deployment details
      description: Host (e.g. Synology DSM 7.x), `PANEL_ADMINS` set or empty, `DISCOVERY_ENABLED`, socket-proxy in use, and any relevant `docker logs homerealm` / proxy output.
      placeholder: |
        Host: Synology DS1522+, DSM 7.2
        PANEL_ADMINS: set
        DISCOVERY_ENABLED: false
        Logs: …
      render: shell
    validations:
      required: false
