name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: When I have a dozen worlds, I can't quickly find…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? UI, CLI, config — whatever fits.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Fits the project's shape?
      description: homerealm is deliberately small — a single Go binary, no database, no JS framework, Tailscale-native.
      options:
        - label: This keeps things simple and doesn't pull in a heavy new dependency or framework.
          required: false
